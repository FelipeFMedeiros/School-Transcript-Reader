<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise Sintática - Gramática Livre de Contexto</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ 
            startOnLoad: false, 
            theme: 'default',
            securityLevel: 'loose',
            flowchart: { curve: 'basis' }
        });
        window.mermaid = mermaid;
    </script>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Estilos para a Árvore de Derivação (Parse Tree)
        const mermaidStyles = `
classDef root fill:#f3f4f6,stroke:#4b5563,stroke-width:2px,font-weight:bold
classDef nonterminal fill:#ffffff,stroke:#3b82f6,stroke-width:2px,color:#1e3a8a
classDef terminal fill:#eff6ff,stroke:#60a5fa,stroke-width:1px,color:#2563eb,stroke-dasharray: 5 5
classDef epsilon fill:#fef2f2,stroke:#ef4444,stroke-width:1px,color:#b91c1c
`;

        const grammarData = [
            {
                id: "G_CABECALHO",
                name: "Estrutura Principal & Cabeçalho",
                description: "Define a macro-estrutura do documento (Axioma) e a descida para os dados pessoais e de vínculo. Projetada sem recursão à esquerda.",
                rules: `
<Historico> ::= <PreHeader> <DadosPessoais> <DadosVinculo> <IndicesAcademicos> <CorpoDocumento> EOF

<DadosPessoais> ::= "Dados" "Pessoais" 
                    "Nome" ":" <SequenciaPalavras> 
                    "Data" "de" "Nascimento" ":" T_DATA 
                    "Nacionalidade" ":" <SequenciaPalavras> 
                    "Nº" "do" "documento" "com" "órgão" "expedidor" ":" <SequenciaPalavras> "," T_MARCADOR_LEGENDA <SequenciaPalavras> T_MARCADOR_LEGENDA
                    "Nº" "do" "CPF" ":" T_CPF

<DadosVinculo> ::= "Dados" "do" "Vínculo" "do" "Discente"
                   "Matrícula" ":" ( T_MATRICULA | T_NUMERO )   // 11 dígitos (>=2023) ou 8 (grade anterior)
                   "Local" "de" "Nascimento" ":" <SequenciaPalavras> T_MARCADOR_LEGENDA <SequenciaPalavras>
                   "Curso" ":" <SequenciaPalavras>
                   "Status" ":" T_PALAVRA
                   "Ênfase" ":" <SequenciaPalavrasOuVazio>

<IndicesAcademicos> ::= "Índices" "Acadêmicos" 
                        "IRA" ":" T_NUMERO
                `,
                graph: `graph TD
${mermaidStyles}
H((Historico)):::root --> PH((PreHeader)):::nonterminal
H --> DP((DadosPessoais)):::nonterminal
H --> DV((DadosVinculo)):::nonterminal
H --> IA((IndicesAcademicos)):::nonterminal
H --> CD((CorpoDocumento)):::nonterminal

DP --> N["Nome :"]:::terminal
DP --> SP1((SequenciaPalavras)):::nonterminal
DP --> CPF["Nº do CPF : T_CPF"]:::terminal

SP1 --> P1["T_PALAVRA"]:::terminal
SP1 --> RP1((RestoPalavras)):::nonterminal
RP1 --> P2["T_PALAVRA"]:::terminal
RP1 --> RP2((RestoPalavras)):::nonterminal
RP2 --> E["ε (Vazio)"]:::epsilon`
            },
            {
                id: "G_REGRAS_AUX",
                name: "Regras Auxiliares (Recursão à Direita)",
                description: "Para ler múltiplas palavras em sequência (como nomes de alunos ou disciplinas) sem causar loops infinitos (recursão à esquerda).",
                rules: `
<SequenciaPalavras> ::= T_PALAVRA <RestoPalavras>
<RestoPalavras>     ::= T_PALAVRA <RestoPalavras> 
                      | ε

<SequenciaPalavrasOuVazio> ::= <SequenciaPalavras> 
                             | ε

<MarcadorOpcional> ::= T_MARCADOR_LEGENDA
                     | ε
                `,
                graph: `graph TD
${mermaidStyles}
SP((SequenciaPalavras)):::root --> TP1["T_PALAVRA (ex: 'Felipe')"]:::terminal
SP --> RP1((RestoPalavras)):::nonterminal

RP1 --> TP2["T_PALAVRA (ex: 'Freitas')"]:::terminal
RP1 --> RP2((RestoPalavras)):::nonterminal

RP2 --> TP3["T_PALAVRA (ex: 'de')"]:::terminal
RP2 --> RP3((RestoPalavras)):::nonterminal

RP3 --> TP4["T_PALAVRA (ex: 'Medeiros')"]:::terminal
RP3 --> RP4((RestoPalavras)):::nonterminal

RP4 --> E["ε (Vazio)"]:::epsilon`
            },
            {
                id: "G_TABELA_DISCIPLINAS",
                name: "Tabela de Componentes Curriculares",
                description: "O núcleo do histórico. Varredura orientada a registros que tolera os dois layouts do SIGAA (nome inline x nome na linha anterior) e o ruído de paginação. O período (T_PERIODO_LETIVO) é repetido por linha no formato real; quando agrupado, vale o último período visto.",
                rules: `
<CorpoDocumento> ::= "Componentes" "Curriculares" <ListaDisciplinas>

<ListaDisciplinas> ::= <ItemCorpo> <ListaDisciplinas>
                     | "Legenda" ...        // âncora de parada
                     | ε

// Cada item do corpo é um período, uma disciplina, uma linha de nome ou ruído.
<ItemCorpo> ::= T_PERIODO_LETIVO <MarcadorOpcional>
              | <Disciplina>
              | <LinhaNome>
              | <Ruido>                      // professor, rodapé, cabeçalho de página

<MarcadorOpcional> ::= T_MARCADOR_LEGENDA    // @ & # § % *
                     | "e"                   // equivalência (palavra de 1 letra)
                     | ε

// Layout A — nome inline, após o código:
<Disciplina> ::= T_COD_DISCIPLINA <SequenciaPalavras> "(" T_NUMERO ")" <CamposNumericos> <Situacao>
// Layout B — nome herdado da <LinhaNome> imediatamente anterior:
               | T_COD_DISCIPLINA <CamposNumericos> <Situacao>

<LinhaNome> ::= <SequenciaPalavras> "(" T_NUMERO ")"   // ex.: "Cálculo (08051111)"

<CamposNumericos> ::= ( T_NUMERO | T_CARGA_HORARIA | "-" | "," | "." ) <CamposNumericos>
                    | ε                      // hora-aula, CH, turma, freq, nota, média

<Situacao> ::= T_SITUACAO_SIGLA              // APR | REP | TRANC | MATR | DISP | ...
             | "Matriculado"
             | ε                             // linha incompleta é tolerada (não-fatal)
                `,
                graph: `graph TD
${mermaidStyles}
LD((ListaDisciplinas)):::root --> IC((ItemCorpo)):::nonterminal
LD --> LD2((ListaDisciplinas)):::nonterminal

IC --> PL["T_PERIODO_LETIVO (ex: 2023.2)"]:::terminal
IC --> MO((MarcadorOpcional)):::nonterminal
IC --> D1((Disciplina)):::nonterminal
IC --> LN((LinhaNome)):::nonterminal

D1 --> CD["T_COD_DISCIPLINA"]:::terminal
D1 --> SP((SequenciaPalavras — nome inline / herdado)):::nonterminal
D1 --> CN((CamposNumericos)):::nonterminal
D1 --> SIT["T_SITUACAO_SIGLA (ex: APR)"]:::terminal

LN --> SP2((SequenciaPalavras)):::nonterminal
LN --> PAR["( T_NUMERO )"]:::terminal

LD2 --> E["ε (fim / 'Legenda')"]:::epsilon`
            },
            {
                id: "G_EQUIVALENCIAS",
                name: "Equivalências e Pendências",
                description: "Mapeia as listas finais do histórico, como disciplinas pendentes e regras de equivalência (dispensa).",
                rules: `
<ResumoCargaHoraria> ::= "Integralização" "das" "Horas" ... <Pendencias>

<Pendencias> ::= "Componentes" "Curriculares" "Obrigatórios" "Pendentes:" T_NUMERO <ListaPendentes> <Equivalencias>
               | <Equivalencias>

<ListaPendentes> ::= <DisciplinaPendente> <RestoPendentes>
<RestoPendentes> ::= <DisciplinaPendente> <RestoPendentes> 
                   | ε

<DisciplinaPendente> ::= T_COD_DISCIPLINA <SequenciaPalavras> "(" T_NUMERO ")" T_CARGA_HORARIA
                       | T_COD_DISCIPLINA <SequenciaPalavras> "(" T_NUMERO ")" "Matriculado" T_CARGA_HORARIA
                       | T_PALAVRA <SequenciaPalavras> T_NUMERO "h" // Para tratar o ENADE

<Equivalencias> ::= "Equivalências:" <ListaEquivalencias>
                  | ε

<ListaEquivalencias> ::= "Cumpriu" T_COD_DISCIPLINA "-" <SequenciaPalavras> "(" T_NUMERO ")" "(" T_CARGA_HORARIA ")" "através" "de" T_COD_DISCIPLINA "-" <SequenciaPalavras> "(" T_NUMERO ")" "(" T_CARGA_HORARIA ")" <RestoEquivalencias>
<RestoEquivalencias> ::= <ListaEquivalencias> 
                       | ε
                `,
                graph: `graph TD
${mermaidStyles}
EQ((Equivalencias)):::root --> T1["'Equivalências:'"]:::terminal
EQ --> LE((ListaEquivalencias)):::nonterminal

LE --> C1["'Cumpriu'"]:::terminal
LE --> D1["T_COD_DISCIPLINA (Original)"]:::terminal
LE --> S1((SequenciaPalavras)):::nonterminal
LE --> AT["'através de'"]:::terminal
LE --> D2["T_COD_DISCIPLINA (Equivalente)"]:::terminal
LE --> RE((RestoEquivalencias)):::nonterminal

RE --> LE2((ListaEquivalencias)):::nonterminal
RE --> E["ε"]:::epsilon`
            }
        ];

        const MermaidViewer = ({ graph }) => {
            const containerRef = useRef(null);

            useEffect(() => {
                let isMounted = true;
                const renderGraph = async () => {
                    if (window.mermaid && containerRef.current) {
                        try {
                            containerRef.current.innerHTML = '';
                            const id = 'mermaid-graph-' + Math.random().toString(36).substring(2, 9);
                            const { svg } = await window.mermaid.render(id, graph);
                            if (isMounted) {
                                containerRef.current.innerHTML = svg;
                            }
                        } catch (error) {
                            console.error("Erro ao renderizar Mermaid:", error);
                        }
                    }
                };
                setTimeout(renderGraph, 100);
                return () => { isMounted = false; };
            }, [graph]);

            return (
                <div 
                    ref={containerRef} 
                    className="w-full flex justify-center py-8 px-4 overflow-x-auto bg-white border-2 border-gray-100 rounded-xl shadow-sm"
                >
                    <div className="animate-pulse text-gray-400">Desenhando Parse Tree...</div>
                </div>
            );
        };

        const App = () => {
            const [selectedId, setSelectedId] = useState(grammarData[0].id);
            const activeGrammar = grammarData.find(g => g.id === selectedId);

            return (
                <div className="flex flex-col md:flex-row h-screen w-full bg-gray-50 text-gray-900">
                    
                    {/* Barra Lateral */}
                    <div className="w-full md:w-80 bg-white border-r border-gray-200 flex flex-col h-1/3 md:h-full shadow-sm z-10">
                        <div className="p-6 border-b border-gray-200 bg-blue-600">
                            <h1 className="text-xl font-bold text-white tracking-tight">Análise Sintática</h1>
                            <p className="text-sm text-blue-100 mt-1">Gramática Livre de Contexto (GLC)</p>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 space-y-2">
                            <div className="pt-2 pb-1 text-xs font-semibold text-gray-400 uppercase tracking-wider px-2">Regras de Produção</div>

                            {grammarData.map((grammar) => (
                                <button
                                    key={grammar.id}
                                    onClick={() => setSelectedId(grammar.id)}
                                    className={`w-full text-left px-4 py-3 rounded-lg text-sm font-medium transition-all duration-200 border ${
                                        selectedId === grammar.id
                                            ? "bg-blue-50 border-blue-300 text-blue-800 shadow-sm"
                                            : "bg-white border-transparent text-gray-600 hover:bg-gray-50 hover:border-gray-200"
                                    }`}
                                >
                                    <div className="font-semibold">{grammar.name}</div>
                                </button>
                            ))}
                            
                            <div className="mt-8 p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
                                <h4 className="text-xs font-bold text-yellow-800 uppercase mb-2">Restrição do Projeto</h4>
                                <p className="text-xs text-yellow-700 leading-relaxed">
                                    Para utilizar o método de <strong>Descida Recursiva</strong>, todas as regras foram modeladas utilizando recursão à direita (como {"<ListaSemestres> ::= <Semestre> <RestoSemestres>"}), evitando loops infinitos no parser Python.
                                </p>
                            </div>
                        </div>
                    </div>

                    {/* Área de Visualização Principal */}
                    <div className="flex-1 flex flex-col h-2/3 md:h-full bg-slate-50">
                        <div className="flex-1 p-6 md:p-10 overflow-y-auto">
                            <div className="max-w-4xl mx-auto space-y-8">
                                
                                <div>
                                    <h2 className="text-3xl font-bold font-serif text-gray-800 mb-3">{activeGrammar.name}</h2>
                                    <p className="text-gray-600 leading-relaxed text-lg border-l-4 border-blue-400 pl-4">
                                        {activeGrammar.description}
                                    </p>
                                </div>

                                <div className="bg-gray-900 rounded-xl overflow-hidden shadow-lg border border-gray-700">
                                    <div className="bg-gray-800 px-4 py-2 border-b border-gray-700 flex items-center">
                                        <span className="text-xs font-mono text-gray-400 uppercase tracking-wider">Regras (Notação BNF)</span>
                                    </div>
                                    <pre className="p-6 text-sm font-mono text-green-400 overflow-x-auto">
                                        <code>{activeGrammar.rules}</code>
                                    </pre>
                                </div>

                                <div>
                                    <h3 className="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-4">Parse Tree (Árvore de Derivação Conceitual)</h3>
                                    <MermaidViewer graph={activeGrammar.graph} />
                                    
                                    {/* Legenda da Parse Tree */}
                                    <div className="mt-4 flex flex-wrap gap-4 text-xs text-gray-600 bg-white p-4 rounded-lg border border-gray-100 shadow-sm">
                                        <div className="flex items-center gap-2">
                                            <div className="w-4 h-4 rounded bg-gray-100 border-2 border-gray-500"></div>
                                            <span className="font-medium">Nó Raiz (Início da Regra)</span>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <div className="w-4 h-4 rounded bg-white border-2 border-blue-500"></div>
                                            <span className="font-medium">Símbolo Não-Terminal `&lt;Regra&gt;`</span>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <div className="w-4 h-4 rounded bg-blue-50 border border-blue-400 border-dashed"></div>
                                            <span className="font-medium">Símbolo Terminal (Token/Palavra)</span>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <div className="w-4 h-4 rounded bg-red-50 border border-red-500"></div>
                                            <span className="font-medium text-red-700">ε (Epsilon - Transição Vazia)</span>
                                        </div>
                                    </div>
                                </div>
                                
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
